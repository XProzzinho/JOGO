<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jogo do Rafael</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9fd3f5;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  [hidden]{display:none!important}
  #jogo-cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #joy{position:fixed;left:40px;bottom:60px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);pointer-events:none;opacity:.55;transition:opacity .2s}
  #joy.on{opacity:1}
  #knob{position:absolute;left:40px;top:40px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .btn{position:fixed;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#14122e;background:rgba(255,255,255,.88);box-shadow:0 6px 18px rgba(0,0,0,.25);border:none}
  #pular{right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));width:96px;height:96px;font-size:17px}
  #correr{right:calc(140px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:72px;height:72px;font-size:13px}
  #correr.on{background:#ffd23c}
  #tit{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));padding:8px 14px;border-radius:14px;background:rgba(20,18,46,.6);color:#fff;font-weight:800;font-size:14px;letter-spacing:.5px}
  #dica{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:10px 16px;border-radius:14px;background:rgba(20,18,46,.7);color:#fff;font-size:14px;text-align:center;max-width:88vw;transition:opacity 1s}
  #dica.some{opacity:0}
  #acao{right:calc(150px + env(safe-area-inset-right,0px));bottom:calc(130px + env(safe-area-inset-bottom,0px));width:96px;height:96px;font-size:16px;background:#ffd23c;animation:pulsa 1.2s ease-in-out infinite}
  @keyframes pulsa{50%{transform:scale(1.08)}}
  #ciclo{right:calc(16px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));width:50px;height:50px;font-size:24px}
  #lugar{position:fixed;left:50%;top:28%;transform:translate(-50%,-10px);font-weight:900;font-size:34px;color:#fff;letter-spacing:2px;text-shadow:0 4px 18px rgba(0,0,0,.6);opacity:0;transition:opacity .6s,transform .6s;pointer-events:none;white-space:nowrap}
  #lugar.on{opacity:1;transform:translate(-50%,0)}
  #fala{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(620px,70vw);padding:14px 18px 12px;border-radius:18px;background:rgba(250,246,236,.96);color:#2a2230;box-shadow:0 10px 30px rgba(0,0,0,.35);border:3px solid #6a4a2a}
  #fala-nome{display:inline-block;margin:-30px 0 6px;padding:4px 12px;border-radius:10px;background:#6a4a2a;color:#fff;font-weight:900;font-size:15px}
  #fala-txt{font-size:18px;line-height:1.35;font-weight:600}
  #fala-mais{margin-top:6px;text-align:right;font-size:12px;color:#8a7a6a;font-weight:700}
</style>
</head>
<body>
<canvas id="jogo-cv"></canvas>
<div id="tit">BRUMAFRIA</div>
<div id="dica">Arraste do lado <b>esquerdo</b> pra andar · do <b>direito</b> pra girar a câmera · chegue perto das pessoas pra conversar</div>
<div id="lugar"></div>
<div id="fala" hidden><div id="fala-nome"></div><div id="fala-txt"></div><div id="fala-mais"></div></div>
<div id="joy"><div id="knob"></div></div>
<button class="btn" id="correr">CORRER</button>
<button class="btn" id="pular">PULAR</button>
<button class="btn" id="acao" hidden>FALAR</button>
<button class="btn" id="ciclo">☾</button>
__THREE__
<script>
__JOGO__
</script>
</body>
</html>

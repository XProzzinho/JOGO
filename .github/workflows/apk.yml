name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'src/**', 'android/**', 'three.min.js', 'vozes/**']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Montar o jogo
        run: python3 build.py
      - name: Baixar o Firebase
        run: |
          mkdir -p firebase
          for f in firebase-app-compat.js firebase-auth-compat.js firebase-firestore-compat.js; do curl -fsSL "https://cdn.jsdelivr.net/npm/firebase@10.12.2/$f" -o "firebase/$f"; done
          ls -la firebase
      - name: Copiar o jogo pro APK
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html three.min.js vozes firebase android/app/src/main/assets/
      - name: Compilar o APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Publicar como Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-$(date -u +%Y%m%d-%H%M)"
          cp android/app/build/outputs/apk/debug/app-debug.apk "/tmp/Jogo-do-Rafael.apk"
          gh release create "$TAG" "/tmp/Jogo-do-Rafael.apk" --repo "${{ github.repository }}" --title "Jogo do Rafael — APK ($(date -u +%d/%m/%Y))" --notes "Baixe o arquivo Jogo-do-Rafael.apk e instale no celular."

name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'src/**', 'android/**', 'three.min.js']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Montar o jogo
        run: python3 build.py
      - name: Copiar o jogo pro APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html three.min.js android/app/src/main/assets/
      - name: Compilar o APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Publicar como Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-$(date -u +%Y%m%d-%H%M)"
          cp android/app/build/outputs/apk/debug/app-debug.apk "/tmp/Jogo-do-Rafael.apk"
          gh release create "$TAG" "/tmp/Jogo-do-Rafael.apk" --repo "${{ github.repository }}" --title "Jogo do Rafael — APK ($(date -u +%d/%m/%Y))" --notes "Baixe o arquivo Jogo-do-Rafael.apk e instale no celular."

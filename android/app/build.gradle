plugins { id 'com.android.application' }
android {
    namespace 'com.xprozzinho.jogo'
    compileSdk 34
    defaultConfig {
        applicationId 'com.brumafria.app'
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName '1.1'
    }
    buildTypes { release { minifyEnabled false } }
    buildFeatures { buildConfig true }
    // duas versões: celular e TV (Fire Stick / Android TV)
    flavorDimensions 'alvo'
    productFlavors {
        celular { dimension 'alvo' }
        firetv { dimension 'alvo'; applicationId 'com.brumafria.tv' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.webkit:webkit:1.8.0' }
